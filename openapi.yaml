openapi: 3.0.3
info:
  title: Invoice reader API
  version: "1.0"
  description: |
    Send an invoice / receipt image, get structured fields back (read by Claude Haiku 5.5, then reconciled by deterministic rules).
    The document is also queued for human review in the portal.
    Call it from a backend, not from a browser: the bearer token must stay secret and CORS is not enabled.
    `merchant.name` and `line_items[].description` are untrusted text printed on the image.
servers:
  - url: http://localhost:8080
security:
  - bearer: []
paths:
  /v1/health:
    get:
      summary: Connectivity check (no model call, no cost)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  scan_enabled: { type: boolean, description: "false = server has no ANTHROPIC_API_KEY; /v1/scan returns 503" }
                  provider: { type: string, nullable: true, example: claude-haiku-5-5 }
                  max_image_bytes: { type: integer, example: 31457280 }
                  schema_version: { type: string, example: "1.0" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/scan:
    post:
      summary: Read one invoice image
      description: |
        Body is the raw image bytes (not multipart, not base64). The same image (by content) sent again returns the earlier result without calling the model.
      parameters:
        - in: query
          name: file
          required: true
          schema: { type: string, maxLength: 200 }
          description: File name WITH extension (jpg, jpeg, png, webp, gif).
        - in: query
          name: batch
          schema: { type: string, maxLength: 60 }
          description: Optional batch label shown in the portal.
        - in: header
          name: x-lang
          schema: { type: string, enum: [zh, en] }
          description: Language of the human-readable `error` text. Use `code` in programs.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: "Read (or already read). An unreadable image is NOT an error: it returns 200 with verdict REVIEW and empty fields."
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan: { $ref: "#/components/schemas/Scan" }
                  receipt: { $ref: "#/components/schemas/Receipt" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/receipts/{id}:
    get:
      summary: Latest state of one document (includes human review edits)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/validate:
    post:
      summary: Reconcile amounts only (no image, no model, no cost)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency: { type: string, nullable: true }
                subtotal: { type: number, nullable: true }
                discount: { type: number, nullable: true }
                service_charge: { type: number, nullable: true }
                tax: { type: number, nullable: true }
                tip: { type: number, nullable: true }
                fees: { type: number, nullable: true }
                rounding: { type: number, nullable: true }
                total: { type: number, nullable: true }
                paid: { type: number, nullable: true }
                change: { type: number, nullable: true }
                items:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      qty: { type: number, nullable: true }
                      price: { type: number, nullable: true }
                taxes:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    properties:
                      label: { type: string, nullable: true }
                      rate: { type: number, nullable: true }
                      base: { type: number, nullable: true }
                      amount: { type: number, nullable: true }
      responses:
        "200": { description: Reconciliation result }
        "401": { $ref: "#/components/responses/Error" }
  /v1/schema:
    get:
      summary: Contract version and the list of untrusted text fields
      responses:
        "200": { description: OK }
  /v2/health:
    get:
      summary: "v2: connectivity check (no model call, no cost)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  scan_enabled: { type: boolean, description: "false = server has no ANTHROPIC_API_KEY; /v2/scan returns 503" }
                  provider: { type: string, nullable: true, example: claude-haiku-5-5 }
                  classify_enabled: { type: boolean }
                  max_image_bytes: { type: integer, example: 31457280 }
                  schema_version: { type: string, example: "2.0" }
                  our_company_configured: { type: boolean, description: "false = invoice direction will be `unknown`" }
                  trusted_types: { type: array, items: { type: string }, description: "types whose classification may be auto-trusted; the rest always go to review" }
                  min_confidence: { type: number }
        "401": { $ref: "#/components/responses/Error" }
  /v2/types:
    get:
      summary: "v2: document types, their field requirements and AutoCount mapping"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: { type: string }
                  types: { type: array, items: { $ref: "#/components/schemas/TypeInfoV2" } }
                  directions: { type: array, items: { type: string } }
                  payment_methods: { type: array, items: { type: string } }
                  type_verdicts: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
  /v2/scan:
    post:
      summary: "v2: classify and read one document image"
      description: |
        Body is the raw image bytes (not multipart, not base64). The same image (by content) sent again returns the earlier result without calling the model.
        Not-yet-trusted types (everything except receipts by default) always come back as verdict REVIEW.
        An unreadable image is NOT an error: 200 with verdict REVIEW, type `other`, empty fields.
      parameters:
        - in: query
          name: file
          required: true
          schema: { type: string, maxLength: 200 }
          description: File name WITH extension (jpg, jpeg, png, webp, gif). PDF is not supported yet.
        - in: query
          name: batch
          schema: { type: string, maxLength: 60 }
          description: Optional batch label shown in the portal.
        - in: query
          name: hint_type
          schema: { type: string, maxLength: 40 }
          description: |
            Optional. The caller already knows the type; it overrides the model's judgement (kept as an alternative) and skips the model-confidence and evidence checks.
            Trust, date, ID and conflict checks still apply. Unknown type -> 422 TYPE_NOT_ENABLED. Ignored for duplicate images.
        - in: header
          name: x-lang
          schema: { type: string, enum: [zh, en] }
          description: Language of the human-readable `error` text. Use `code` in programs.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Read (or already read).
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan: { $ref: "#/components/schemas/ScanV2" }
                  receipt: { $ref: "#/components/schemas/DocumentV2" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /v2/receipts:
    get:
      summary: "v2: list and search documents (newest first)"
      parameters:
        - { in: query, name: type, schema: { type: string }, description: "Document type, or `none` for never-classified. Unknown -> 422 TYPE_NOT_ENABLED." }
        - { in: query, name: direction, schema: { type: string, enum: [sales, purchase, unknown] } }
        - { in: query, name: state, schema: { type: string, enum: [pending, approved, rejected, all] } }
        - { in: query, name: q, schema: { type: string, maxLength: 100 }, description: "Search file name, party, title, document number, reviewer, note." }
        - { in: query, name: from, schema: { type: string }, description: "Document date from, YYYY-MM-DD" }
        - { in: query, name: to, schema: { type: string }, description: "Document date to, YYYY-MM-DD" }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ListItemV2" } }
                  total: { type: integer }
                  page: { type: integer }
                  page_size: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v2/receipts/{id}:
    get:
      summary: "v2: latest state of one document (includes human review edits)"
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentV2" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The token the portal was started with (--token). Not needed when the server only listens on 127.0.0.1 without a token.
  responses:
    Error:
      description: |
        Error. Branch on `code`:
        400 IMAGE_EMPTY_OR_TOO_BIG / IMAGE_UNSUPPORTED / VALIDATION; 401 TOKEN_REQUIRED; 404 RECEIPT_NOT_FOUND;
        429 SCAN_RATE_LIMIT; 502 SCAN_AUTH / SCAN_NETWORK / SCAN_UPSTREAM; 503 SCAN_DISABLED; 504 SCAN_TIMEOUT.
      content:
        application/json:
          schema:
            type: object
            required: [error, code]
            properties:
              error: { type: string, description: "Human-readable, localized (x-lang). Do not parse." }
              code: { type: string }
  schemas:
    Scan:
      type: object
      properties:
        file: { type: string }
        id: { type: integer, nullable: true }
        duplicate: { type: boolean, description: "true = this exact image was read before; model was not called" }
        status: { type: string, enum: [AUTO_VERIFIED, AUTO, CORRECTED, PARTIAL, REVIEW] }
        reasons: { type: array, items: { type: string } }
        ms: { type: integer, description: "model time in ms (0 for duplicates)" }
        merchant: { type: string, nullable: true }
        total: { type: number, nullable: true }
        currency: { type: string, nullable: true }
        items: { type: integer, description: "number of line items" }
    Money:
      type: number
      nullable: true
    Receipt:
      type: object
      properties:
        schema_version: { type: string }
        id: { type: integer }
        file: { type: string }
        document:
          type: object
          properties:
            date: { type: string, nullable: true, description: "YYYY-MM-DD" }
            currency: { type: string, nullable: true }
        merchant:
          type: object
          properties:
            name: { type: string, nullable: true, description: "UNTRUSTED text from the image" }
        amounts:
          type: object
          properties:
            subtotal: { $ref: "#/components/schemas/Money" }
            discount: { $ref: "#/components/schemas/Money" }
            service_charge: { $ref: "#/components/schemas/Money" }
            tax: { $ref: "#/components/schemas/Money" }
            tip: { $ref: "#/components/schemas/Money" }
            fees: { $ref: "#/components/schemas/Money" }
            rounding: { $ref: "#/components/schemas/Money" }
            total: { $ref: "#/components/schemas/Money" }
            paid: { $ref: "#/components/schemas/Money" }
            change: { $ref: "#/components/schemas/Money" }
        taxes:
          type: array
          items:
            type: object
            properties:
              label: { type: string, nullable: true }
              rate: { type: number, nullable: true }
              base: { type: number, nullable: true }
              amount: { type: number, nullable: true }
        line_items:
          type: array
          items:
            type: object
            properties:
              description: { type: string, description: "UNTRUSTED text from the image" }
              quantity: { type: number, nullable: true }
              uom: { type: string, nullable: true }
              discount: { type: number, nullable: true }
              tax_rate: { type: number, nullable: true }
              total_price: { type: number, nullable: true, description: "net line amount = quantity x unit price - discount; tax is not included" }
        reconciliation:
          type: object
          properties:
            mode: { type: string }
            has_failure: { type: boolean }
            checks:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [ok, warn, fail, info] }
                  params: { type: object, additionalProperties: true }
            suggestions: { type: array, items: { type: object, additionalProperties: true } }
            flags: { type: array, items: { type: string } }
        quality:
          type: object
          properties:
            verdict: { type: string, enum: [AUTO_VERIFIED, AUTO, CORRECTED, PARTIAL, REVIEW], description: "Use this to decide whether the data can be used as-is" }
            needs_review: { type: boolean, description: "true until a human has confirmed; does NOT by itself mean something is wrong" }
            reasons: { type: array, items: { type: string } }
        review:
          type: object
          properties:
            state: { type: string, enum: [pending, approved, rejected] }
            reviewed_by: { type: string, nullable: true }
            reviewed_at: { type: string, nullable: true }
            human_edited_fields: { type: array, items: { type: string } }
        untrusted_text_fields: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
    ScanV2:
      type: object
      properties:
        file: { type: string }
        id: { type: integer, nullable: true }
        duplicate: { type: boolean }
        status: { type: string, nullable: true, enum: [REVIEW, PARTIAL, CORRECTED, AUTO_VERIFIED, AUTO] }
        reasons: { type: array, items: { type: string } }
        ms: { type: integer }
        merchant: { type: string, nullable: true, description: "The other party: customer for sales documents, issuer / shop otherwise" }
        total: { type: number, nullable: true }
        currency: { type: string, nullable: true }
        items: { type: integer }
        document_type: { type: string, nullable: true }
        direction: { type: string, nullable: true, enum: [sales, purchase, unknown] }
        title: { type: string, nullable: true }
    ListItemV2:
      type: object
      properties:
        id: { type: integer }
        file: { type: string }
        title: { type: string, nullable: true }
        document_type: { type: string, nullable: true }
        direction: { type: string, enum: [sales, purchase, unknown] }
        doc_no: { type: string, nullable: true }
        party: { type: string, nullable: true }
        doc_date: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        total: { type: number, nullable: true }
        confidence: { type: number, nullable: true }
        verdict: { type: string, enum: [REVIEW, PARTIAL, CORRECTED, AUTO_VERIFIED, AUTO] }
        needs_review: { type: boolean }
        review_state: { type: string, enum: [pending, approved, rejected] }
        imported_at: { type: string }
    TypeInfoV2:
      type: object
      properties:
        id: { type: string }
        label: { type: object, properties: { zh: { type: string }, en: { type: string } } }
        default_direction: { type: string, nullable: true }
        postable: { type: boolean }
        reconcile_amounts: { type: boolean }
        needs: { type: object, additionalProperties: { type: string } }
        model_outputs: { type: boolean }
        autocount: { type: object, properties: { sales: { type: object, nullable: true }, purchase: { type: object, nullable: true } } }
    DocumentV2:
      "description": "Response body of GET /v2/receipts/{id} and the `receipt` member of POST /v2/scan. Unknown values are null, never invented. Text taken from the image (title, keywords, party names, descriptions) is untrusted."
      "type": "object"
      "additionalProperties": false
      "required":
        - "schema_version"
        - "id"
        - "file"
        - "classification"
        - "title"
        - "keywords"
        - "language"
        - "header"
        - "parties"
        - "amounts"
        - "taxes"
        - "line_items"
        - "payment"
        - "relations"
        - "autocount_hint"
        - "reconciliation"
        - "quality"
        - "review"
        - "untrusted_text_fields"
        - "warnings"
      "properties":
        "schema_version":
          "type": "string"
          "enum":
            - "2.0"
        "id":
          "type": "integer"
          "minimum": 1
        "file":
          "type": "string"
          "maxLength": 200
        "classification":
          "type": "object"
          "additionalProperties": false
          "required":
            - "document_type"
            - "autocount_doc_type"
            - "direction"
            - "confidence"
            - "alternatives"
            - "evidence"
            - "title_printed"
            - "type_verdict"
          "properties":
            "document_type":
              "enum":
                - "receipt"
                - "invoice"
                - "sales_invoice"
                - "purchase_invoice"
                - "sales_order"
                - "quotation"
                - "delivery_order"
                - "credit_note"
                - "other"
              "nullable": true
            "autocount_doc_type":
              "type": "string"
              "nullable": true
              "maxLength": 8
            "direction":
              "enum":
                - "sales"
                - "purchase"
                - "unknown"
            "confidence":
              "type": "number"
              "nullable": true
              "minimum": 0
              "maximum": 1
            "alternatives":
              "type": "array"
              "maxItems": 2
              "items":
                "$ref": "#/components/schemas/AlternativeV2"
            "evidence":
              "type": "array"
              "maxItems": 5
              "items":
                "type": "string"
                "maxLength": 120
            "title_printed":
              "type": "string"
              "nullable": true
              "maxLength": 60
            "type_verdict":
              "enum":
                - "ok"
                - "low_confidence"
                - "direction_unknown"
                - "evidence_missing"
                - "conflict"
                - "unverified"
                - "unclassified"
        "title":
          "type": "string"
          "nullable": true
          "maxLength": 80
        "keywords":
          "type": "array"
          "maxItems": 10
          "items":
            "type": "string"
            "maxLength": 40
        "language":
          "enum":
            - "en"
            - "ms"
            - "zh"
            - "mixed"
          "nullable": true
        "header":
          "type": "object"
          "additionalProperties": false
          "required":
            - "doc_no"
            - "doc_date"
            - "due_date"
            - "valid_until"
            - "currency"
            - "reference"
            - "customer_po_no"
            - "terms"
            - "supplier_invoice_no"
            - "delivery_address"
          "properties":
            "doc_no":
              "type": "string"
              "nullable": true
              "maxLength": 40
            "doc_date":
              "type": "string"
              "nullable": true
              "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
            "due_date":
              "type": "string"
              "nullable": true
              "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
            "valid_until":
              "type": "string"
              "nullable": true
              "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
            "currency":
              "type": "string"
              "nullable": true
              "maxLength": 8
            "reference":
              "type": "string"
              "nullable": true
              "maxLength": 20
            "customer_po_no":
              "type": "string"
              "nullable": true
              "maxLength": 40
            "terms":
              "type": "string"
              "nullable": true
              "maxLength": 60
            "supplier_invoice_no":
              "type": "string"
              "nullable": true
              "maxLength": 40
            "delivery_address":
              "type": "string"
              "nullable": true
              "maxLength": 200
        "parties":
          "type": "object"
          "additionalProperties": false
          "required":
            - "issuer"
            - "counterparty"
          "properties":
            "issuer":
              "allOf":
                - "$ref": "#/components/schemas/PartyV2"
              "nullable": true
            "counterparty":
              "allOf":
                - "$ref": "#/components/schemas/PartyV2"
              "nullable": true
        "amounts":
          "type": "object"
          "additionalProperties": false
          "required":
            - "subtotal"
            - "discount"
            - "service_charge"
            - "tax"
            - "tip"
            - "fees"
            - "rounding"
            - "total"
            - "paid"
            - "change"
            - "outstanding"
          "properties":
            "subtotal":
              "type": "number"
              "nullable": true
            "discount":
              "type": "number"
              "nullable": true
            "service_charge":
              "type": "number"
              "nullable": true
            "tax":
              "type": "number"
              "nullable": true
            "tip":
              "type": "number"
              "nullable": true
            "fees":
              "type": "number"
              "nullable": true
            "rounding":
              "type": "number"
              "nullable": true
            "total":
              "type": "number"
              "nullable": true
            "paid":
              "type": "number"
              "nullable": true
            "change":
              "type": "number"
              "nullable": true
            "outstanding":
              "type": "number"
              "nullable": true
        "taxes":
          "type": "array"
          "maxItems": 20
          "items":
            "$ref": "#/components/schemas/TaxV2"
        "line_items":
          "type": "array"
          "maxItems": 500
          "items":
            "$ref": "#/components/schemas/ItemV2"
        "payment":
          "type": "object"
          "additionalProperties": false
          "required":
            - "method"
            - "reference"
            - "card_last4"
          "properties":
            "method":
              "enum":
                - "cash"
                - "card"
                - "bank_transfer"
                - "ewallet"
                - "cheque"
                - "credit"
                - "unknown"
              "nullable": true
            "reference":
              "type": "string"
              "nullable": true
              "maxLength": 60
            "card_last4":
              "type": "string"
              "nullable": true
              "pattern": "^\\d{4}$"
        "relations":
          "type": "object"
          "additionalProperties": false
          "required":
            - "original_invoice_no"
            - "related_po_no"
            - "related_so_no"
            - "related_do_no"
            - "reason"
          "properties":
            "original_invoice_no":
              "type": "string"
              "nullable": true
              "maxLength": 40
            "related_po_no":
              "type": "string"
              "nullable": true
              "maxLength": 40
            "related_so_no":
              "type": "string"
              "nullable": true
              "maxLength": 40
            "related_do_no":
              "type": "string"
              "nullable": true
              "maxLength": 40
            "reason":
              "type": "string"
